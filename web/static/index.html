<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Varta.AI — Real-time bilingual speech translation powered by Sarvam AI. Speak in one language, hear in another." />
  <title>Varta.AI — Live Speech Translation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body class="h-full overflow-hidden">

  <!-- ── App Shell ──────────────────────────────────────────────────────── -->
  <div id="app" class="h-full flex flex-col">

    <!-- ── Header ─────────────────────────────────────────────────────── -->
    <header class="flex-shrink-0 px-4 py-3 flex items-center justify-between
                   border-b border-white/5">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600
                    flex items-center justify-center text-sm font-bold">
          V
        </div>
        <h1 class="text-lg font-semibold text-gradient">Varta.AI</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="session-badge"
              class="hidden text-[10px] font-mono px-2 py-0.5 rounded-full
                     bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        </span>
        <span class="text-[10px] text-white/30">v0.1.0</span>
      </div>
    </header>

    <!-- ── Main Content — Two Speaker Panels ──────────────────────────── -->
    <main class="flex-1 min-h-0 p-3 md:p-4 flex flex-col md:flex-row gap-3 md:gap-4">

      <!-- ── Speaker A Panel ──────────────────────────────────────────── -->
      <section class="flex-1 min-h-0 glass-card flex flex-col" id="panel-a">
        <!-- Panel Header -->
        <div class="flex-shrink-0 px-4 py-3 border-b border-white/5
                    flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-speaker-a shadow-lg shadow-speaker-a/30"></div>
            <span class="text-sm font-medium text-speaker-a">Speaker A</span>
          </div>
          <span id="lang-a"
                class="text-[11px] text-white/40 font-medium">
            Auto-detecting…
          </span>
        </div>

        <!-- Transcript Area -->
        <div id="transcript-a"
             class="flex-1 min-h-0 overflow-y-auto transcript-scroll
                    px-4 py-3 flex flex-col gap-2">
          <div class="empty-state flex-1 flex items-center justify-center
                      text-white/20 text-sm">
            Press the mic to start speaking
          </div>
        </div>

        <!-- Controls -->
        <div class="flex-shrink-0 px-4 py-4 border-t border-white/5
                    flex flex-col items-center gap-2">
          <!-- Live transcript preview pill -->
          <div id="live-a" class="live-pill min-h-[24px] max-w-full truncate"></div>

          <!-- Record button -->
          <div class="relative">
            <!-- Ping animation ring -->
            <div id="ping-a"
                 class="hidden absolute inset-0 rounded-full bg-speaker-a/30
                        animate-pulse-ring pointer-events-none"></div>
            <button id="btn-a"
                    class="btn-record-idle"
                    onclick="toggleRecord('a')"
                    title="Press to record">
              <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </button>
          </div>

          <!-- Status label -->
          <span id="label-a" class="text-[11px] text-white/40">Press to record</span>

          <!-- Audio playing indicator -->
          <div id="audio-indicator-a"
               class="hidden flex items-center gap-1.5 text-[11px] text-speaker-b/80">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-speaker-b animate-pulse"></span>
            Playing translation…
          </div>

          <!-- Processing spinner -->
          <div id="spinner-a" class="hidden">
            <svg class="w-5 h-5 animate-spin text-white/40" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          </div>
        </div>
      </section>

      <!-- ── Divider (desktop) ────────────────────────────────────────── -->
      <div class="hidden md:flex items-center">
        <div class="w-px h-full bg-gradient-to-b from-transparent via-white/10 to-transparent"></div>
      </div>

      <!-- ── Speaker B Panel ──────────────────────────────────────────── -->
      <section class="flex-1 min-h-0 glass-card flex flex-col" id="panel-b">
        <!-- Panel Header -->
        <div class="flex-shrink-0 px-4 py-3 border-b border-white/5
                    flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-speaker-b shadow-lg shadow-speaker-b/30"></div>
            <span class="text-sm font-medium text-speaker-b">Speaker B</span>
          </div>
          <span id="lang-b"
                class="text-[11px] text-white/40 font-medium">
            Auto-detecting…
          </span>
        </div>

        <!-- Transcript Area -->
        <div id="transcript-b"
             class="flex-1 min-h-0 overflow-y-auto transcript-scroll
                    px-4 py-3 flex flex-col gap-2">
          <div class="empty-state flex-1 flex items-center justify-center
                      text-white/20 text-sm">
            Press the mic to start speaking
          </div>
        </div>

        <!-- Controls -->
        <div class="flex-shrink-0 px-4 py-4 border-t border-white/5
                    flex flex-col items-center gap-2">
          <!-- Live transcript preview pill -->
          <div id="live-b" class="live-pill min-h-[24px] max-w-full truncate"></div>

          <!-- Record button -->
          <div class="relative">
            <div id="ping-b"
                 class="hidden absolute inset-0 rounded-full bg-speaker-b/30
                        animate-pulse-ring pointer-events-none"></div>
            <button id="btn-b"
                    class="btn-record-idle"
                    onclick="toggleRecord('b')"
                    title="Press to record">
              <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </button>
          </div>

          <!-- Status label -->
          <span id="label-b" class="text-[11px] text-white/40">Press to record</span>

          <!-- Audio playing indicator -->
          <div id="audio-indicator-b"
               class="hidden flex items-center gap-1.5 text-[11px] text-speaker-a/80">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-speaker-a animate-pulse"></span>
            Playing translation…
          </div>

          <!-- Processing spinner -->
          <div id="spinner-b" class="hidden">
            <svg class="w-5 h-5 animate-spin text-white/40" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
          </div>
        </div>
      </section>

    </main>

    <!-- ── Footer ─────────────────────────────────────────────────────── -->
    <footer class="flex-shrink-0 px-4 py-2 text-center text-[10px] text-white/15
                   border-t border-white/5">
      Powered by Sarvam AI · Real-time speech translation
    </footer>

  </div>

  <!-- ── App Entry Point ────────────────────────────────────────────────── -->

</body>
</html>
